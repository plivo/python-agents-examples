[project]
name = "gpt4o-modulatevelma2-cartesiasonic3-pipecat"
version = "0.1.0"
description = "Voice agent using GPT-4o LLM with a Tavily web-search tool, Modulate Velma-2 STT, and Cartesia Sonic TTS with Pipecat orchestration and Plivo telephony"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=15.0",
    "plivo>=4.59.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.0",
    "phonenumbers>=8.13.0",
    "tavily-python>=0.5.0",
    "pipecat-ai[cartesia,openai,silero]>=1.12.0",
]

[project.optional-dependencies]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "traceloop-sdk>=0.30.0",
]
streaming = [
    "redis[hiredis]>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "faster-whisper>=1.2.1",
    # PyAV 19 removed the metadata_errors kwarg that faster-whisper 1.2.1
    # still passes, which breaks the local transcription helper in
    # tests/test_e2e_live.py. Affects every example in the repo.
    "av<19",
    # Caller speech for tests/test_multiturn_voice.py: gTTS -> MP3 -> pydub/ffmpeg
    # -> 8kHz mono -> μ-law. Declared so the test never skips for a missing tool.
    "gTTS>=2.5.4",
    "pydub>=0.25.1",
    # pydub imports the stdlib audioop module, removed in Python 3.13
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    # ffmpeg binary inside the wheel (macOS, Linux, Windows): no system install
    "imageio-ffmpeg>=0.6.0",
]

[tool.ruff]
exclude = [".git", "*_pb2.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
