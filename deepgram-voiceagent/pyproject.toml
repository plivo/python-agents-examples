[project]
name = "deepgram-voiceagent-plivo"
version = "0.1.0"
description = "Plivo inbound + outbound voice agent on the Deepgram Voice Agent API (managed listen/think/speak pipeline)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=15.0",
    "plivo>=4.59.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "phonenumbers>=8.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.44b0",
    "traceloop-sdk>=0.30.0",
]
streaming = [
    "redis[hiredis]>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "faster-whisper>=1.2.1",
]

# Example category (read by scripts/validate-example.sh). Managed voice-agent
# platforms own turn detection and barge-in; see CLAUDE.md "Managed Voice-Agent Platforms".
[tool.voice-agent-example]
category = "managed-platform"

[tool.ruff]
exclude = [".git", "*_pb2.py"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
